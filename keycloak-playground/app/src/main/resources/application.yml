    realm: app
    client-id: manage-users-client
    client-secret: WaMJOGUZxiWdEXCpMJj5tqP97kDP5Dyg
    grant-type: client_credentials
#    client-id: dev-direct-grant-cli
#    client-secret: 9ee6f35d-c4e5-4c1f-ba48-2b6b4b00e7d1
#    grant-type: client_credentials
  oidc:
    client-id: app-client
    client-secret: FMw6IdT3jtK65rFAsBVFdQjirvf5WglF
    endpoints:
      authorize: http://localhost:8180/realms/app/protocol/openid-connect/auth
      token: http://localhost:8180/realms/app/protocol/openid-connect/token
